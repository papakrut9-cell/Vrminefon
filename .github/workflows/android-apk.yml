name: android-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install Android SDK parts
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # The runner ships the SDK; only cmdline-tools' bin is off PATH, and
          # android-actions/setup-android@v3 fails at the long-removed "tools" package.
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n1)"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build the APK (release)
        run: PROFILE=release ./packaging/android/build_apk.sh

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-phonevr-apk
          path: target/android/horizon.apk
          if-no-files-found: error
